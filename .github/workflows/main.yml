name: REON Hourly Check
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pandas requests
      - run: python auto_seg_hourly.py
      - name: Save State
        run: |
          git config --global user.name "REON-BOT"
          git config --global user.email "bot@reon.com"
          git add last_alarm_state.json || echo "no state yet"
          git commit -m "update state" || echo "no change"
          git push
